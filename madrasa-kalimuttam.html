<!DOCTYPE html>
<html lang="ml"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>മദ്രസ കളിമുറ്റം</title>
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF7F1;--card:#fff;--ink:#12362F;--sub:#4F7068;--main:#0F8F6E;--sun:#FFC83D;--sky:#3AA7E8;--line:#BFE3D5;--th:#0F8F6E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D2520;--card:#15372F;--ink:#E8F7F1;--sub:#9CC4B8;--main:#2BC49A;--line:#25574B}}
:root[data-theme="dark"]{--bg:#0D2520;--card:#15372F;--ink:#E8F7F1;--sub:#9CC4B8;--main:#2BC49A;--line:#25574B}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manjari","Noto Sans Malayalam",system-ui,sans-serif;font-size:18px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:30px;margin:6px 0 2px}h2{font-size:24px;margin:0 0 8px}
p{margin:0 0 12px;color:var(--sub)}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:12px 18px;background:var(--main);color:#fff;font-weight:700}
button.alt{background:var(--sun);color:#3a2a00}button.ghost{background:transparent;color:var(--main);border:2px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:16px 0}
.kid{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px 10px;text-align:center;color:var(--ink);font-weight:400}
.kid:hover{border-color:var(--main)}
.avw{position:relative;width:96px;height:96px;margin:0 auto 8px}
.av{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:44px;background:var(--sun);overflow:hidden;border:5px solid var(--th)}
.av img{width:100%;height:100%;object-fit:cover}
.sk{position:absolute;right:-6px;bottom:-4px;font-size:30px;line-height:1}
.nm{font-weight:700;font-size:20px}.st{color:var(--sub);font-size:16px}
.add{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:14px;margin:12px 0}
.add input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{display:flex;gap:14px;align-items:center;background:var(--th);color:#fff;border-radius:28px;padding:16px;margin:10px 0 16px}
.hero .avw{margin:0;width:84px;height:84px;flex:none}.hero .av{border-color:#fff}.hero p{color:#fff;margin:0;opacity:.92}
.games{display:grid;gap:12px}
.g{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:700;padding:12px 16px;width:100%}
.g span.e{font-size:34px}.g small{display:block;font-weight:400;color:var(--sub);font-size:15px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.c{aspect-ratio:1;font-size:34px;background:var(--sky);color:transparent;border-radius:18px;padding:0;display:grid;place-items:center;overflow:hidden}
.c img{width:100%;height:100%;object-fit:cover;visibility:hidden}
.c.on,.c.ok{background:var(--card);color:inherit;border:2px solid var(--main)}.c.on img,.c.ok img{visibility:visible}.c.ok{background:var(--sun)}
.opt{display:block;width:100%;margin:8px 0;background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left}
.opt.good{background:#1BA672;color:#fff}.opt.bad{background:#D9534F;color:#fff}
.arena{position:relative;height:300px;background:linear-gradient(var(--card),var(--bg));border:2px solid var(--line);border-radius:24px;overflow:hidden;margin:12px 0;touch-action:manipulation}
.star{position:absolute;font-size:44px;padding:0;background:none;line-height:1;animation:pop .25s ease-out}
.star img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--sun)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.star{animation:none}}
.big{font-size:22px;color:var(--ink);font-weight:700}
.pz{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(100%,330px);aspect-ratio:1;margin:12px auto;background:var(--line);padding:4px;border-radius:18px}
.pt{border-radius:10px;padding:0;background-size:300% 300%;background-color:var(--card)}
.pt.empty{background:transparent;visibility:hidden}
.ans{display:flex;gap:8px;justify-content:center;min-height:56px;margin:10px 0;flex-wrap:wrap}
.ans span{min-width:44px;height:52px;border-bottom:4px solid var(--main);font-size:30px;font-weight:700;text-align:center;color:var(--ink)}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.tiles button{min-width:56px;font-size:26px;background:var(--sky)}.tiles button:disabled{opacity:.25}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.sw button{width:52px;height:52px;border-radius:50%;padding:0;font-size:26px;background:var(--card);border:3px solid var(--line)}
.sw button.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--sun)}
.tm{margin:6px 0 10px;font-weight:700;color:var(--ink)}.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--main);transition:width 1s linear}.bar i.low{background:#D9534F}
.lb{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px;margin:12px 0}.lr{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line)}.lr .avw{width:48px;height:48px;margin:0;flex:none}.lr .av{border-width:3px;font-size:22px}.lr .sk{font-size:18px}.lr .nm{flex:1}.rk{width:32px;text-align:center;font-size:22px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
button{transition:transform .1s}button:active{transform:scale(.97)}
.hero{position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18)}.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.24),transparent 60%);pointer-events:none}.hero>*{position:relative}
.kid,.lb,.g,.add{box-shadow:0 2px 10px rgba(15,60,50,.09)}.kid:hover{box-shadow:0 6px 18px rgba(15,60,50,.16)}
.qh{display:flex;justify-content:space-between;align-items:center}.sm{font-size:14px;color:var(--sub)}
.ic{width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center;background:transparent;color:var(--main);border:2px solid var(--main)}
.ic.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tg{display:inline-block;background:var(--line);color:var(--ink);font-size:13px;font-weight:700;border-radius:9px;padding:2px 10px}
.pl{display:inline-block;border-radius:16px;padding:12px 18px;background:var(--sun);color:#3a2a00;font-weight:700;cursor:pointer}.po{width:100%;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
@media (prefers-reduced-motion:reduce){.ic.spin svg{animation:none}}
</style></head>
